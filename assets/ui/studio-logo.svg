
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="300"
  height="300"
  color="#ffffff"
>
  <title>映界 · yinside</title>

  <style>
    .draw-line {
      stroke-dasharray: 54.6;
      stroke-dashoffset: 54.6;
      animation: drawLine 2.2s cubic-bezier(.4, 0, .2, 1) .4s forwards;
    }

    .word-path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: drawWord 4.4s cubic-bezier(.4, 0, .2, 1) .4s forwards;
    }

    .sun-reveal {
      transform-box: fill-box;
      transform-origin: center bottom;
      transform: scale(0);
      animation: sunrise 5.333s cubic-bezier(.16, 1, .3, 1) 2.6s both;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawWord {
      to { stroke-dashoffset: 0; }
    }

    @keyframes sunrise {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw-line, .word-path, .sun-reveal {
        animation: none;
      }
      .draw-line, .word-path { stroke-dashoffset: 0; }
      .sun-reveal { transform: scale(1); }
    }
  </style>

  <defs>
    <clipPath id="planet-clip" clipPathUnits="userSpaceOnUse">
      <rect
        class="sun-reveal"
        x="0"
        y="8"
        width="100"
        height="30"
      />
    </clipPath>
  </defs>

  <!-- 半圆向左微移，底边继续与线段平行 -->
  <g transform="translate(-8 11) rotate(-60.4 36 32)">
    <path
      d="M20 32 A16 16 0 0 1 52 32 Z"
      fill="currentColor"
      clip-path="url(#planet-clip)"
    />
  </g>

  <path
    class="draw-line"
    d="M40.9 28 L19.1 66.4"
    fill="none"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
  />

  <g class="word-path">
    <!-- i -->
    <path d="M36 54 V65.7"/>
    <path d="M36 49.5 V49.6"/>

    <!-- n -->
    <path d="M41 65.7 V54
             M41 59
             C41 52 50 52 50 59
             V65.7"/>

    <!-- s -->
    <path d="
      M62 56
      C60.7 54.8 59.3 54.5 57.8 54.5
      C55.5 54.5 54.2 55.7 54.2 57.2
      C54.2 59 56.1 59.8 58.2 60.5
      C60.5 61.3 62 62.2 62 63.8
      C62 65.3 60.4 66.2 58.2 66.2
      C56.5 66.2 55 65.6 54 64.8
    "/>

    <!-- i -->
    <path d="M66 54 V65.7"/>
    <path d="M66 49.5 V49.6"/>

    <!-- d -->
    <path d="M80 49 V65.7"/>
    <path d="
      M80 60
      C80 56 78 54 75.5 54
      C73 54 71 56.5 71 60
      C71 63.5 73 66 75.5 66
      C78 66 80 64 80 60
    "/>

    <!-- e -->
    <path d="
      M95.5 60
      C95.5 56.5 93.3 54 90.3 54
      C87 54 85 56.5 85 60
      C85 63.8 87.2 66 90.3 66
      C92.3 66 93.8 65.3 95 64
      M85.3 59.5 H95
    "/>
  </g>
</svg>
