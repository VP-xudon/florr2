<!doctype html>
<html lang="zh">
<head>
  <script>
    (function(){
      function say(s){ var el=document.getElementById('__res'); if(!el){el=document.createElement('pre');el.id='__res';document.body.appendChild(el);} el.textContent += s+'\n'; }
      // 鎶婁袱寮犲崱(6=Stinger, 1=Basic)娓叉煋鍒伴〉闈紝渚夸簬鎴浘瀵规瘮
      function showCard(svg, label){
        try{
          var c = CardRenderer.createCard({ svg: svg, rarity: 'common', count: 1 });
          c.style.cssText = 'position:absolute;left:10px;top:'+(label==='basic'?10:230)+'px;width:160px;height:160px;background:#222;border:2px solid #555;';
          c._label = label;
          document.body.appendChild(c);
        }catch(e){ say('card '+svg+' err:'+e.message); }
      }
      setTimeout(function(){
        try{
          showCard('6','stinger');
          showCard('1','basic');
          say('cards created. waiting for paint...');
        }catch(e){ say('THROW:'+e.message); }
      }, 3200);
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Florr.io 还原 — Garden</title>
  <!-- Ubuntu 字体：canvas 与 DOM 统一使用；离线时自动回退系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=57" />
  <!-- 语言选择：必须在其它脚本之前【同步】确定。
       支持 ?i18n=en_us / ?i18n=zh_cn，也支持逗号分隔（?mode=debug,i18n=zh_cn）。
       之所以用 document.write：语言包必须在 data.js 之前注册（RARITIES/花瓣名在加载时就要取到译文），
       而异步加载来不及。只有请求中文时才多拉一个包，英文用户零额外开销。 -->
  <script>
    (function () {
      var q = location.search.replace(/,/g, '&');
      var m = /[?&](?:i18n|lang)=([A-Za-z0-9_-]+)/.exec(q);
      var code = m ? m[1].toLowerCase().replace(/-/g, '_') : '';
      window.__i18nReq = code;                       // '' = 不指定（默认英文）
      if (code === 'zh_cn' || code === 'zh') {
        document.write('<script src="assets/i18n/zh_CN/zh_CN.js?v=6"><\/script>');
      }
    })();
  </script>
</head>
